; Protótipo experimental para RE4 original Steam UHD, não para o remake.
; Leia LEIA-ME.txt antes de instalar. Reinicie o jogo depois de alterar.
[CONTROLS]
Enabled = 1
; Ative somente para investigar uma falha. Desligado evita registros no movimento.
Diagnostics = 0
; Unidades internas por tick de 30 Hz. O delta do jogo ajusta para 60 FPS.
AimMoveUnitsPerTick = 35

[KEYS]
; Códigos Windows: W=87, S=83, A=65, D=68, Shift=16.
Forward = 87
Back = 83
Left = 65
Right = 68
Run = 16

[CONTROLLER]
; Controle (Xbox/XInput): andar enquanto mira com o analógico. 1 = ligado, 0 = desligado.
; Fora da mira o controle usa o movimento e a câmera originais do jogo.
Enabled = 1
; Qual analógico move o personagem durante a mira: 0 = esquerdo, 1 = direito.
MoveStick = 0
; Zona morta do analógico (0.0 a 0.9). Aumente se o personagem andar sozinho.
DeadZone = 0.25
; 1 = inverte frente/trás, caso o personagem ande para trás ao empurrar para frente.
InvertY = 0
